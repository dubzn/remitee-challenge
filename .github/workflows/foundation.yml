# Foundation only: strict TypeScript plus real, isolated Anvil/PostgreSQL smoke
# and negative checks via the same `npm run check` used locally. A separate job
# runs real contract tests. The indexer job runs actual application acceptance;
# read API responses share the application suite. A separate Compose job verifies
# the complete reviewer startup and four-outcome demo without host app dependencies.
name: Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  contracts:
    name: Contract format, build, tests and ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository and pinned contract dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify contracts without Anvil or PostgreSQL
        timeout-minutes: 10
        run: npm run contracts:check

      - name: Generate and verify contract reference documentation
        timeout-minutes: 5
        run: npm run contracts:docs

  foundation:
    name: Foundation checks (typecheck, Anvil/PostgreSQL smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REMITEE_CHECK_PROJECT: "remitee-check-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify pinned toolchain and Docker Compose
        run: |
          expected_node="v$(cat .nvmrc)"
          expected_npm="$(node -p 'require("./package.json").engines.npm')"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"
          echo "Node ${actual_node} (expected ${expected_node}); npm ${actual_npm} (expected ${expected_npm})"
          if [ "$actual_node" != "$expected_node" ] || [ "$actual_npm" != "$expected_npm" ]; then
            echo "::error::Toolchain does not match .nvmrc / package.json engines"
            exit 1
          fi
          docker version --format 'Docker client {{.Client.Version}}, server {{.Server.Version}}'
          docker compose version

      - name: Install locked dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Run foundation checks (npm run check)
        timeout-minutes: 15
        run: npm run check

      # npm run check already prints logs and cleans up in-process on failure;
      # this only shows state left behind if that process was killed (e.g. timeout).
      - name: Show remaining test project state (failure only)
        if: failure()
        timeout-minutes: 2
        run: |
          if [ ! -f compose.yaml ]; then
            echo "compose.yaml not present (checkout did not complete); no test project was started."
            exit 0
          fi
          docker compose -f compose.yaml -p "$REMITEE_CHECK_PROJECT" ps --all
          docker compose -f compose.yaml -p "$REMITEE_CHECK_PROJECT" logs --no-color --timestamps --tail 200

      - name: Remove only this run's test project
        if: always()
        timeout-minutes: 5
        run: |
          case "$REMITEE_CHECK_PROJECT" in
            remitee-check-*) ;;
            *) echo "::error::Refusing cleanup for unexpected project '${REMITEE_CHECK_PROJECT}'"; exit 1 ;;
          esac
          if [ ! -f compose.yaml ]; then
            echo "::notice::compose.yaml not present (checkout did not complete); no test project could have been started."
            exit 0
          fi
          docker compose -f compose.yaml -p "$REMITEE_CHECK_PROJECT" down --volumes --remove-orphans
          label="label=com.docker.compose.project=${REMITEE_CHECK_PROJECT}"
          containers="$(docker ps --all --quiet --filter "$label")"
          networks="$(docker network ls --quiet --filter "$label")"
          volumes="$(docker volume ls --quiet --filter "$label")"
          if [ -n "${containers}${networks}${volumes}" ]; then
            echo "::error::Resources remain for ${REMITEE_CHECK_PROJECT}"
            printf 'containers:\n%s\nnetworks:\n%s\nvolumes:\n%s\n' "$containers" "$networks" "$volumes"
            exit 1
          fi
          echo "No containers, networks or volumes remain for ${REMITEE_CHECK_PROJECT}."

  indexer:
    name: Indexer and read API acceptance (Ponder/Anvil/PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REMITEE_INDEXER_TEST_PROJECT: "remitee-indexer-check-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Check out repository and pinned contract dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Check application types and projection rules
        run: |
          npm run typecheck
          npm run indexer:typecheck
          npm run indexer:unit
          npm run api:spec
          npm run api:unit
      - name: Run actual indexer and public HTTP acceptance
        timeout-minutes: 12
        run: npm run indexer:test
      - name: Show indexer evidence on failure
        if: failure()
        run: |
          if [ -d ".local/$REMITEE_INDEXER_TEST_PROJECT" ]; then
            find ".local/$REMITEE_INDEXER_TEST_PROJECT" -name 'indexer-*.log' -exec tail -n 30 {} +
          fi
      - name: Remove only this run's indexer test project
        if: always()
        run: |
          case "$REMITEE_INDEXER_TEST_PROJECT" in
            remitee-indexer-check-*) ;;
            *) exit 1 ;;
          esac
          if [ -f compose.yaml ]; then
            docker compose -f compose.yaml -p "$REMITEE_INDEXER_TEST_PROJECT" down --volumes --remove-orphans
            label="label=com.docker.compose.project=$REMITEE_INDEXER_TEST_PROJECT"
            test -z "$(docker ps --all --quiet --filter "$label")"
            test -z "$(docker network ls --quiet --filter "$label")"
            test -z "$(docker volume ls --quiet --filter "$label")"
          fi

  application:
    name: Full Docker startup and lifecycle demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REMITEE_APP_TEST_PROJECT: "remitee-app-check-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Check out repository and pinned contract dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Node for the dependency-free test driver
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build and verify the complete Docker reviewer path
        timeout-minutes: 17
        run: node scripts/compose-acceptance.ts
      - name: Show application evidence on failure
        if: failure()
        run: |
          if [ -f ".local/$REMITEE_APP_TEST_PROJECT/failure.log" ]; then
            tail -n 100 ".local/$REMITEE_APP_TEST_PROJECT/failure.log"
          fi
      - name: Remove only this run's application project
        if: always()
        run: |
          case "$REMITEE_APP_TEST_PROJECT" in
            remitee-app-check-*) ;;
            *) exit 1 ;;
          esac
          if [ -f compose.yaml ]; then
            docker compose -f compose.yaml -p "$REMITEE_APP_TEST_PROJECT" --profile app --profile demo down --volumes --remove-orphans
            label="label=com.docker.compose.project=$REMITEE_APP_TEST_PROJECT"
            test -z "$(docker ps --all --quiet --filter "$label")"
            test -z "$(docker network ls --quiet --filter "$label")"
            test -z "$(docker volume ls --quiet --filter "$label")"
          fi
